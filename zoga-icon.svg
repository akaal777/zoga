<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Import the Playfair Display font just like the website -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,900&amp;display=swap');
      
      .brand-logo-icon {
        font-family: 'Playfair Display', serif;
        fill: #e60000;
        font-weight: 900;
        font-style: italic;
        letter-spacing: -0.05em;
        font-size: 110px;
        transform: scaleY(1.1);
        transform-origin: center;
      }
    </style>
    
    <!-- Recreating the text-shadow: 0 16px 40px rgba(230,0,0,0.12) -->
    <filter id="zoga-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="15" flood-color="#e60000" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Background is set to black to match the theme-color #050505 or transparent -->
  <rect width="256" height="256" fill="#050505" rx="50" />

  <!-- Logo Text -->
  <text 
    x="48%" 
    y="55%" 
    text-anchor="middle" 
    dominant-baseline="middle" 
    class="brand-logo-icon" 
    filter="url(#zoga-shadow)">
    zoga
  </text>
</svg>
